aid: socket
name: Socket
description: Socket is a developer-first software supply chain security platform that protects
  applications from supply chain attacks by deeply inspecting open source dependencies across
  npm, PyPI, Maven, Go, NuGet, RubyGems, Cargo and more. Socket detects malware, hidden code,
  typosquats, install scripts, protestware, and risky capabilities in packages, scores their
  quality and risk, and enforces security and license policies across repositories through a
  REST API, CLI, GitHub App, MCP server, and static reachability analysis. Founded by Feross
  Aboukhadijeh and backed by a16z, Socket is used by engineering teams at organizations
  including Vercel, Replit, and Brave.
