tools:
- name: depscore
  description: Get the dependency score of packages with the `depscore` tool from Socket. Use 'unknown'
    for version if not known. Use this tool to scan dependencies for their quality and security on existing
    code or when code is generated. Stop generating code and ask the user how to proceed when any of the
    scores are low. When checking dependencies, make sure to also check the imports in the code, not just
    the manifest files (pyproject.toml, package.json, etc).
  source_operation: openapi/socket-openapi-original.json#batchPackageFetchByOrg
- name: organizations
  description: List the Socket organizations the authenticated user belongs to with the `organizations`
    tool. Use this to discover the `org_slug` values needed by other org-scoped tools (e.g. `alerts`,
    `threat_feed`), or when the user asks which organizations they have access to.
- name: alerts
  description: List the latest security alerts for a Socket organization with the `alerts` tool. Requires
    `org_slug` — call the `organizations` tool first if you don't have it. Supports filtering by severity,
    category, status, artifact type/name, alert type, and repo. Use this to surface supply-chain, vulnerability,
    quality, license, and maintenance issues across the org's monitored packages. Results are paginated
    — pass the previous response's `endCursor` as `cursor` to fetch the next page.
- name: threat_feed
  description: Look up items in the Socket organization threat feed with the `threat_feed` tool. Requires
    `org_slug` — call the `organizations` tool first if you don't have it. Returns recently flagged packages
    (malware, typosquats, obfuscated code, etc.) along with a `nextPageCursor` for pagination. Use `filter`
    to narrow the threat category (default `mal` for malware), `ecosystem` to scope to a registry, or
    `name`/`version` to look up a specific package. Pass the previous response's cursor as `cursor` to
    fetch the next page.
- name: package_files
  description: List the files published in a package using the `package_files` tool from Socket. Returns
    a tree of paths and sizes for any package on a supported ecosystem (npm, pypi, gem, cargo, maven,
    golang, nuget, chrome, openvsx). Useful for inspecting what a dependency ships before installing it.
    After calling this, use `package_file_contents` with one of the paths to read the file's contents.
- name: package_file_contents
  description: Read a single file from a package using the `package_file_contents` tool from Socket. Pass
    the `hash` printed next to each entry in `package_files` output. Returns up to 1 MB of UTF-8 text;
    binary files return metadata only.
- name: package_file_grep
  description: Search a single file from a package for lines matching a JavaScript regular expression.
    Pass the `hash` printed next to each entry in `package_files` output. The file is fetched from Socket
    once per session and cached, so repeated greps on the same hash skip the network. Returns matching
    lines with line numbers (grep -n style); binary files are refused. Useful for locating a specific
    symbol, import, or string inside a dependency without dumping the whole file.
