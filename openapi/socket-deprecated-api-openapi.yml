openapi: 3.0.0
info:
  description: Specification of the Socket API endpoints
  title: API Endpoints alerts deprecated API
  version: '0'
servers:
- url: https://api.socket.dev/v0
tags:
- name: deprecated
paths:
  /dependencies/upload:
    post:
      tags:
      - deprecated
      summary: Create a snapshot of all dependencies from manifest information
      deprecated: true
      operationId: createDependenciesSnapshot
      parameters:
      - name: repository
        in: query
        required: false
        description: ''
        schema:
          type: string
          default: ''
      - name: branch
        in: query
        required: false
        description: ''
        schema:
          type: string
          default: ''
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties:
                type: string
                default:
                  type: Buffer
                  data: []
                format: binary
                description: ''
              properties:
                repository:
                  type: string
                  description: ''
                  default: ''
                branch:
                  type: string
                  description: ''
                  default: ''
              description: ''
        required: false
      security:
      - bearerAuth:
        - report:write
      - basicAuth:
        - report:write
      description: '**This endpoint is deprecated.**


        Upload a set of manifest or lockfiles to get your dependency tree analyzed by Socket.

        You can upload multiple lockfiles in the same request, but each filename must be unique.


        The name of the file must be in the supported list.


        For example, these are valid filenames: "requirements.txt", "package.json", "folder/package.json", and "deep/nested/folder/package.json".


        This endpoint consumes 100 units of your quota.


        This endpoint requires the following org token scopes:

        - report:write'
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                description: ''
                properties: {}
          description: ID of the dependencies snapshot
        '400':
          $ref: '#/components/responses/SocketBadRequest'
        '401':
          $ref: '#/components/responses/SocketUnauthorized'
        '403':
          $ref: '#/components/responses/SocketForbidden'
        '404':
          $ref: '#/components/responses/SocketNotFoundResponse'
        '429':
          $ref: '#/components/responses/SocketTooManyRequestsResponse'
        '500':
          $ref: '#/components/responses/SocketInternalServerError'
      x-readme: {}
  /orgs/{org_slug}/full-scans/diff:
    get:
      tags:
      - deprecated
      summary: Diff Full Scans
      deprecated: true
      operationId: GetOrgDiffScan
      parameters:
      - name: org_slug
        in: path
        required: true
        description: The slug of the organization
        schema:
          type: string
      - name: after
        in: query
        required: true
        description: The full scan ID of the base/target of the diff (older)
        schema:
          type: string
      - name: before
        in: query
        required: true
        description: The full scan ID of the head/changed side of the diff (newer)
        schema:
          type: string
      - name: include_license_details
        in: query
        required: false
        description: Include license details in the response. This can increase the response size significantly.
        schema:
          type: boolean
          default: false
      - name: omit_unchanged
        in: query
        required: false
        description: Omit unchanged artifacts from the response. When set to true, the unchanged field will be set to null.
        schema:
          type: boolean
          default: false
      security:
      - bearerAuth:
        - full-scans:list
      - basicAuth:
        - full-scans:list
      description: '**This endpoint is deprecated.**


        Get the difference between two existing Full Scans. The results are not persisted.


        This endpoint consumes 1 unit of your quota.


        This endpoint requires the following org token scopes:

        - full-scans:list'
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                description: ''
                properties:
                  before:
                    type: object
                    additionalProperties: false
                    description: ''
                    properties:
                      id:
                        type: string
                        description: ''
                        default: ''
                      created_at:
                        type: string
                        description: ''
                        default: ''
                      updated_at:
                        type: string
                        description: ''
                        default: ''
                      organization_id:
                        type: string
                        description: ''
                        default: ''
                      organization_slug:
                        type: string
                        description: ''
                        default: ''
                      repository_id:
                        type: string
                        description: ''
                        default: ''
                      repository_slug:
                        type: string
                        description: ''
                        default: ''
                      branch:
                        type: string
                        description: ''
                        default: ''
                        nullable: true
                      commit_message:
                        type: string
                        description: ''
                        default: ''
                        nullable: true
                      commit_hash:
                        type: string
                        description: ''
                        default: ''
                        nullable: true
                      pull_request:
                        type: integer
                        description: ''
                        default: 0
                        nullable: true
                      committers:
                        type: array
                        items:
                          type: string
                          description: ''
                          default: ''
                        description: ''
                      html_url:
                        type: string
                        description: ''
                        default: ''
                        nullable: true
                      api_url:
                        type: string
                        description: ''
                        default: ''
                        nullable: true
                    required:
                    - api_url
                    - branch
                    - commit_hash
                    - commit_message
                    - committers
                    - created_at
                    - html_url
                    - id
                    - organization_id
                    - organization_slug
                    - pull_request
                    - repository_id
                    - repository_slug
                    - updated_at
                  after:
                    type: object
                    additionalProperties: false
                    description: ''
                    properties:
                      id:
                        type: string
                        description: ''
                        default: ''
                      created_at:
                        type: string
                        description: ''
                        default: ''
                      updated_at:
                        type: string
                        description: ''
                        default: ''
                      organization_id:
                        type: string
                        description: ''
                        default: ''
                      organization_slug:
                        type: string
                        description: ''
                        default: ''
                      repository_id:
                        type: string
                        description: ''
                        default: ''
                      repository_slug:
                        type: string
                        description: ''
                        default: ''
                      branch:
                        type: string
                        description: ''
                        default: ''
                        nullable: true
                      commit_message:
                        type: string
                        description: ''
                        default: ''
                        nullable: true
                      commit_hash:
                        type: string
                        description: ''
                        default: ''
                        nullable: true
                      pull_request:
                        type: integer
                        description: ''
                        default: 0
                        nullable: true
                      committers:
                        type: array
                        items:
                          type: string
                          description: ''
                          default: ''
                        description: ''
                      html_url:
                        type: string
                        description: ''
                        default: ''
                        nullable: true
                      api_url:
                        type: string
                        description: ''
                        default: ''
                        nullable: true
                    required:
                    - api_url
                    - branch
                    - commit_hash
                    - commit_message
                    - committers
                    - created_at
                    - html_url
                    - id
                    - organization_id
                    - organization_slug
                    - pull_request
                    - repository_id
                    - repository_slug
                    - updated_at
                  artifacts:
                    type: object
                    additionalProperties: false
                    description: Artifacts in the diff grouped by how they changed between the before and after scans.
                    properties:
                      added:
                        type: array
                        items:
                          $ref: '#/components/schemas/SocketDiffArtifact'
                        description: Artifacts present in the after scan but not the before scan.
                      removed:
                        type: array
                        items:
                          $ref: '#/components/schemas/SocketDiffArtifact'
                        description: Artifacts present in the before scan but not the after scan.
                      unchanged:
                        type: array
                        items:
                          $ref: '#/components/schemas/SocketDiffArtifact'
                        description: Artifacts present in both scans with no changes. Null when omitted via the omit_unchanged query parameter.
                        nullable: true
                      replaced:
                        type: array
                        items:
                          $ref: '#/components/schemas/SocketDiffArtifact'
                        description: Artifacts replaced between the scans, e.g. the same package supplied by a different source.
                      updated:
                        type: array
                        items:
                          $ref: '#/components/schemas/SocketDiffArtifact'
                        description: Artifacts whose version changed between the scans.
                    required:
                    - added
                    - removed
                    - replaced
                    - unchanged
                    - updated
                  directDependenciesChanged:
                    type: boolean
                    default: false
                    description: ''
                  diff_report_url:
                    type: string
                    description: ''
                    default: ''
                    nullable: true
                required:
                - after
                - artifacts
                - before
                - diff_report_url
                - directDependenciesChanged
          description: The difference between the two provided Full Scans.
        '400':
          $ref: '#/components/responses/SocketBadRequest'
        '401':
          $ref: '#/components/responses/SocketUnauthorized'
        '403':
          $ref: '#/components/responses/SocketForbidden'
        '404':
          $ref: '#/components/responses/SocketNotFoundResponse'
        '429':
          $ref: '#/components/responses/SocketTooManyRequestsResponse'
      x-readme: {}
